# Конфігурація для uv. Запуск: uv run pytest -v
# uv сам створить .venv і встановить залежності при першому запуску.

[project]
name = "hw3-mas-production"
version = "1.0.0"
description = "ДЗ3: production-ready MAS HR-скринінгу з MCP, guardrails, HITL та evals"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0",                      # кастомний MCP-сервер (tools/resources/prompts)
    "mcp>=1.20",                         # StdioServerParameters для CrewAI-клієнта
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",  # AsyncSqliteSaver: persistence + HITL
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-mcp-adapters>=0.2",       # MCP tools -> LangChain tools
    "langchain>=1.0",                    # langfuse.langchain.CallbackHandler
    "chromadb>=1.0",                     # Agentic RAG з ДЗ2
    "crewai>=1.0",
    "crewai-tools[mcp]>=0.17",           # MCPServerAdapter
    "langfuse>=3.0",                     # observability
    "openinference-instrumentation-crewai>=0.1",  # OTEL-міст для CrewAI
    "pydantic>=2.10",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "jupyter>=1.0",
    "nbformat>=5.0",
]

# Проєкт — набір скриптів, а не пакет для встановлення.
[tool.uv]
package = false

# Тести живуть у tests/, модулі — у корені, тому корінь треба додати до sys.path.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "test_mcp_server.py"]
asyncio_mode = "auto"
